name: Deploy payments Worker

# Publishes apps/payments-worker to Cloudflare Workers (free plan, no card).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# The Worker's own secrets (PAYSTACK_SECRET_KEY, FIREBASE_SERVICE_ACCOUNT) are set in the Cloudflare dashboard, not here.
on:
  push:
    branches: [main]
    paths: ['apps/payments-worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zexcore/payments-worker typecheck
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/payments-worker
