name: Deploy Firebase rules and payments Worker

# Runs when firestore.rules/indexes or the Worker change on main (or by hand from the Actions tab).
# Repository secrets needed (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT   service-account JSON (Firebase Admin / Rules Admin) for project zexcore-5d6c0
#   CLOUDFLARE_API_TOKEN       token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID      Cloudflare account id
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'firestore.indexes.json', 'firebase.json', 'workers/payments/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require service account
        shell: bash
        run: '[ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ] || { echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set"; exit 1; }'
      - name: Deploy Firestore rules and indexes
        shell: bash
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 deploy --only firestore:rules,firestore:indexes --project zexcore-5d6c0 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

  payments-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set"; exit 1; }
      - name: Deploy Worker
        working-directory: workers/payments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 deploy
