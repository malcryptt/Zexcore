name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zexcore_admin
          POSTGRES_PASSWORD: zexcore_admin_secret
          POSTGRES_DB: zexcore_db
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U zexcore_admin -d zexcore_db"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://zexcore_app:zexcore_secret@localhost:5433/zexcore_db
      ADMIN_DATABASE_URL: postgres://zexcore_owner:zexcore_owner_secret@localhost:5433/zexcore_db
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create database roles
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "postgres://zexcore_admin:zexcore_admin_secret@localhost:5433/zexcore_db" \
            -v owner_pass="'zexcore_owner_secret'" -v app_pass="'zexcore_secret'" \
            -v dbname="zexcore_db" -f scripts/db-setup-roles.sql
      - name: Build all packages (typecheck)
        run: pnpm build
        env:
          VITE_API_URL: https://api.example.invalid
      - name: Tests
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=vitest-results.json
      - name: Summarise test failures
        if: failure()
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("vitest-results.json","utf8"));
            for (const f of r.testResults.filter(x => x.status === "failed")) {
              const msgs = [f.message, ...f.assertionResults.flatMap(a => a.failureMessages ?? [])].filter(Boolean).join("\n---\n");
              console.log("::error title=" + f.name.split("/").slice(-2).join("/") + "::" + msgs.slice(0, 3500).replace(/%/g,"%25").replace(/\r/g,"").replace(/\n/g,"%0A"));
            }'
